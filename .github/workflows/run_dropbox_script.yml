name: Run PDF to Natural Speech Dropbox Pipeline

on:
  workflow_dispatch: # Enables manual trigger via "Run workflow" button

jobs:
  execute-shell-script:
    runs-on: ubuntu-latest
    
    # Grants GitHub Actions write permissions to push back to the repository
    permissions:
      contents: write

    steps:
      # Step 1: Checkout the repository with Git LFS enabled for the vendor folder
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Step 2: Explicitly pull LFS objects to materialize binaries on the runner
      - name: Pull Git LFS binaries
        run: git lfs pull

      # Step 3: Set up Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Matches Python 3.10 stable binary wheels for spaCy 3.7.5

      # Step 4: Grant execution permissions for the shell scripts
      - name: Make scripts executable
        run: chmod +x ./main.sh ./process_downloaded_pdfs.sh ./PDFMerge.sh

      # Step 5: Run the main.sh script
      - name: Run main.sh
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: ./main.sh

      # Step 6: Commit and push newly harvested LFS wheels back to the repository
      - name: Commit and push updated vendor LFS binaries
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are any changes in the vendor folder
          git status
          git add vendor/
          
          if git diff --staged --quiet; then
            echo "No changes detected in vendor/ folder. Skipping push."
          else
            git commit -m "chore(vendor): auto-update binary wheels from live run [skip ci]"
            git push origin master
          fi