name: Run PDF to Natural Speech Dropbox Pipeline

on:
  workflow_dispatch: # Enables manual trigger via "Run workflow" button

jobs:
  execute-shell-script:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Step 3: Grant execution permissions for the shell scripts
      - name: Make scripts executable
        run: chmod +x ./main.sh ./process_downloaded_pdfs.sh ./PDFMerge.sh

      # Step 4: Run the main.sh script
      - name: Run main.sh
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: ./main.sh